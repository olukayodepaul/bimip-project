syntax = "proto3";

package bimip;

// ---------------- Identity ----------------
message Identity {
  string eid = 1;                              // User’s global identifier (e.g., account ID or JID)
  optional string connection_resource_id = 2;  // Identifier for a specific device or session instance
  optional string node = 3;                             // System node handling this entity (cluster context)
}




// ---------------- PushNotification ----------------
message PushNotification {
  string id = 1;
  Identity from = 2;
  Identity to = 3;
  string type = 4;
  int64 timestamp = 5;
  bytes payload = 6;
}



// ---------------- TokenAuthority ----------------
message TokenAuthority {
  Identity to = 1;
  string token = 2;
  int32 type = 3;
  int32 task = 4;
  int64 timestamp = 5;
  string details = 6;
}

// ---------------- LocationStream ----------------
message LocationStream {
  string id = 1;
  Identity from = 2;
  Identity to = 3;
  double latitude = 4;
  double longitude = 5;
  optional double altitude = 6;
  int64 timestamp = 7;
}




//user protobuf

message Logout {
  Identity from = 1;
  int64 timestamp = 4;
}



message Body {
  int32 route_id = 1;
  repeated Message messages = 2;
  int64 timestamp = 3;
}


message Ping {
  string id = 1;
  Identity from = 2;
  int32 type = 3;
  int64 timestamp = 4;
}

message OffsetCommit {
  Identity from = 1;
  int32 type = 2;
  int64 offset = 3;
  int64 timestamp = 4;
}

message ProtocolError {
  int32 route_id = 1;
  string details = 2;
  int64 timestamp = 3;
}

message MessageDeliveryReceipts {
  string id = 1;
  Identity from = 2;
  Identity to = 3;
  int64 offset = 4;
  int64 timestamp = 5;
}

message Message {
  string id = 1;
  Identity from = 2;
  Identity to = 3;
  optional int64 offset = 4;
  int64 timestamp = 5;
  bytes payload = 6;
  optional int32 delivery_type = 7;
  int32 participant_role = 8;
  int32 content_type = 9;
  bytes ephemeral_public_key = 10;
  bytes mac = 11;
  int32 message_type = 12;
}

message Compose {
  Identity to = 1;
  Identity from = 2;
  int32 type = 3;
  int64 timestamp = 4;
}

message Awareness {
  Identity from = 1;
  int32 presence = 2;
  int64 offset = 3;
  int32 broadcast = 4;
  int64 timestamp = 5;
}

// ---------------- MessageScheme ----------------
message MessageScheme {
  int64 route_id = 1;
  oneof payload {
    Awareness awareness = 2;
    Ping ping = 3;
    Compose compose = 4;
    TokenAuthority token_authority = 5;
    Message message = 6;
    OffsetCommit offset_commit = 7;
    PushNotification push_notification = 8;
    LocationStream location_stream = 9;
    Body body = 10;
    ProtocolError protocol_error = 11;
    Logout logout = 12;
    MessageDeliveryReceipts message_delivery_receipts = 13;
  }
}
  


  