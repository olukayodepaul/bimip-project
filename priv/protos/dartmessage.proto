syntax = "proto3";

package bimip;

// ---------------- Identity ----------------
message Identity {
  string eid = 1;                              // User’s global identifier (e.g., account ID or JID)
  optional string connection_resource_id = 2;  // Identifier for a specific device or session instance
  optional string node = 3;                             // System node handling this entity (cluster context)
}

// ---------------- Flow ----------------
message Flow {
  string id = 1;
  Identity from = 2;
  string category = 3;
  int64 timestamp = 4;
  bytes payload = 5;
  bytes signature = 6; // Proof that 'from' actually sent this
  optional int64 ttl = 7;
}

// ---------------- LocationStream ----------------
message LocationStream {
  Identity from = 1;
  Identity to = 2;
  int64 timestamp = 3;
  string key_version = 4;    // "Key #5" - tells the server which key to use
  bytes iv = 5;              // 12-byte random initialization vector
  bytes tag = 6;             // 16-byte GCM authentication tag
  bytes encrypted_blob = 7;  // THIS MUST BE BYTES (The encrypted LocationPayload)
}

// ---------------- LocationPayload (The "Secret" Message) ----------------
// This is what lives INSIDE the encrypted_blob
message LocationPayload {
  double latitude = 1;
  double longitude = 2;
  optional double altitude = 3;
  optional float speed = 4;
  optional float heading = 5;
}

// ---------------- LocationVideoStream (Wire Stanza) ----------------
message LocationVideoStream {
  Identity from = 1;
  Identity to = 2;
  int64 timestamp = 3;
  
  // Tactical Security Header
  string key_version = 4;
  bytes iv = 5;              // 12-byte initialization vector
  bytes tag = 6;             // 16-byte GCM authentication tag
  
  // The "Black Box"
  bytes encrypted_video_blob = 7; // Serialized + Encrypted VideoPayload

  // Keep this plain for the Elixir Load Balancer to prioritize
  bool is_emergency = 8; 
}

// ---------------- VideoPayload (Internal) ----------------
message VideoPayload {
  double latitude = 1;
  double longitude = 2;
  double speed = 3;
  float heading = 4;
  string stream_id = 5;
  VideoSource source = 6;
  VideoTrigger trigger = 7;

  oneof transport {
    string hls_url = 8;
    string rtsp_url = 9;
    bytes clip_preview = 10; // Thumbnails stay inside the encrypted blob
  }
}


// ---------------- Video Enums ----------------

enum VideoSource {
  VIDEO_SOURCE_UNSPECIFIED = 0;
  CAMERA_FRONT = 1;
  CAMERA_BACK = 2;
  EXTERNAL_STREAM = 3;
}

enum VideoTrigger {
  VIDEO_TRIGGER_UNSPECIFIED = 0;
  MANUAL_ALERT = 1;
  AUTOMATIC_INCIDENT = 2;
  PROXIMITY_ALERT = 3;
}



// type 1: revoke, 2-accept, 3-reject
message Token {
  string id = 1;
  Identity from = 2;
  string token = 3;
  int32 type = 4; 
  int64 timestamp = 5;
}


// type 1: terminate, 2-accept, 3-reject
message Logout {
  string id = 1;
  Identity from = 2;
  int32 type = 3; 
  int64 timestamp = 4;
}

message Body {
  int32 route_id = 1;
  repeated Message messages = 2;
  repeated Flow flow = 3;
  int64 timestamp = 4;
}

message Ping {
  string id = 1;
  Identity from = 2;
  int32 type = 3;
  int64 timestamp = 4;
}

message OffsetCommit {
  Identity from = 1;
  int32 type = 2;
  int64 offset = 3;
  int64 timestamp = 4;
}

message ProtocolError {
  int32 route_id = 1;
  string details = 2;
  int64 timestamp = 3;
}

message MessageDeliveryReceipts {
  string id = 1;
  Identity from = 2;
  Identity to = 3;
  int64 offset = 4;
  int64 timestamp = 5;
}

message Message {
  string id = 1;
  Identity from = 2;
  Identity to = 3;
  optional int64 offset = 4;
  int64 timestamp = 5;
  bytes payload = 6;
  optional int32 delivery_type = 7;
  int32 participant_role = 8;
  int32 content_type = 9;
  bytes ephemeral_public_key = 10;
  bytes mac = 11;
  int32 message_type = 12;
}

message Compose {
  Identity to = 1;
  Identity from = 2;
  int32 type = 3;
  int64 timestamp = 4;
}

message Awareness {
  Identity from = 1;
  int32 presence = 2;
  int64 offset = 3;
  int32 broadcast = 4;
  int64 timestamp = 5;
}

message Subscriber {
  int64 route_id = 14;
 
}


// ---------------- MessageScheme ----------------
message MessageScheme {
  int64 route_id = 1;
  oneof payload {
    Awareness awareness = 2;
    Ping ping = 3;
    Compose compose = 4;
    Token token = 5;
    Message message = 6;
    OffsetCommit offset_commit = 7;
    Flow flow = 8;
    LocationStream location_stream = 9;
    Body body = 10;
    ProtocolError protocol_error = 11;
    Logout logout = 12;
    MessageDeliveryReceipts message_delivery_receipts = 13;
    Subscriber Subscriber = 14;
    LocationVideoStream location_video_stream = 15;
  }
}
  




  